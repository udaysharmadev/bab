<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><title>Bad at Boating — render fixture</title><style>html,body{margin:0;overflow:hidden}#world{position:fixed;inset:0;background:#a8c6c2}canvas{display:block}#label{position:fixed;left:20px;bottom:16px;color:#fff4cd;font:11px system-ui;text-shadow:0 1px 4px #123}</style></head><body><div id="world"></div><div id="label"></div><script type="module">
import { RiverScene } from '/src/client/scene.ts';
import * as T from 'three';
import { DT, PHYSICS_VERSION, PROTOCOL_VERSION } from '/src/shared/protocol.ts';
import { SWEEPERS, sampleSweeper, sampleWaterwheel, sampleWaterwheel2, riverX, channelSlope, bankEdge } from '/src/shared/world.ts';
const view = new URL(location.href).searchParams.get('view') ?? 'crew';
const positions = {shoal:{x:-10.5,y:.08,z:260},bank:{x:0,y:.08,z:188},rescue:{x:-6,y:.08,z:378},waterwheel:{x:0,y:.08,z:456},crew:{x:0,y:.08,z:0}, shore:{x:8,y:.08,z:2}, trees:{x:8,y:.08,z:8}, grass:{x:8,y:.08,z:2}, wreck:{x:0,y:-.15,z:25}, spikes:{x:-3,y:.08,z:50}, vortex:{x:0,y:.08,z:106}, log:{x:0,y:.08,z:86}, gorge:{x:0,y:.08,z:181}, rapids:{x:0,y:.08,z:310}, timber:{x:0,y:.08,z:419}, narrows:{x:0,y:.08,z:546}, millstone:{x:0,y:.08,z:870},boulders:{x:0,y:.08,z:950},wheel2:{x:0,y:.08,z:1030},haven:{x:0,y:.08,z:1100},finish:{x:0,y:.08,z:1390}, underside:{x:0,y:.08,z:0}};
const scene = new RiverScene(document.getElementById('world'));
window.scene = scene;
window.riverX = riverX;
window.checkBankVegetation=()=>{
 const faces=[];for(const group of scene.chunks.values())for(const mesh of group.children)if(mesh.material?.name==='geological-bank')faces.push(mesh);
 const ray=new T.Raycaster(),matrix=new T.Matrix4(),position=new T.Vector3(),failures=[];let checks=0,maxError=0;
 let paintChecks=0,paintMaxError=0;
 for(const group of scene.chunks.values())for(const mesh of group.children)if(mesh.material?.name==='bank-paint'){
  const points=mesh.geometry.getAttribute('position');for(let i=0;i<points.count;i++){
   position.fromBufferAttribute(points,i).applyMatrix4(mesh.matrixWorld);
   const error=Math.abs(position.x-bankEdge(position.z,-1)-.02);paintMaxError=Math.max(paintMaxError,error);paintChecks++;
  }
 }
 for(const group of scene.vegetation.values())for(const mesh of group.children)for(const index of [...new Set([0,Math.floor(mesh.count/2),mesh.count-1])]){
  if(index<0)continue;mesh.getMatrixAt(index,matrix);position.setFromMatrixPosition(matrix);if(position.z<140)continue;
  ray.set(new T.Vector3(position.x,30,position.z),new T.Vector3(0,-1,0));const hit=ray.intersectObjects(faces)[0];
  const error=hit?Math.abs(position.y-hit.point.y):Infinity;maxError=Math.max(maxError,error);checks++;
  if(error>.0001)failures.push({name:mesh.name,position:position.toArray(),surface:hit?.point.y,error});
 }
 return {checks,maxError,failures,paintChecks,paintMaxError};
};
if(new URL(location.href).searchParams.has('noRefraction'))scene.water.capture=()=>{scene.water.material.uniforms.refractionReady.value=0;};
const tick = 480, time = tick * DT, authored=positions[view], position={...authored,x:riverX(authored.x,authored.z)}, yaw=Math.atan(channelSlope(position.z));
scene.setSnapshot({protocol:PROTOCOL_VERSION,physics:PHYSICS_VERSION,tick,position,rotation:{x:0,y:Math.sin(yaw/2),z:0,w:Math.cos(yaw/2)},velocity:{x:channelSlope(position.z),y:0,z:1},blades:[-1,1,-1,1].map((side,i)=>({x:side*1.45,y:i===0?-.32:.62,z:i<2?.95:-.95,immersion:i===0?1:0,force:i===0?120:0,state:i===0?'WATER':'AIR'})),ack:[0,0,0,0],crew:[0,1,2,3].map(seat=>({seat,connected:true,ready:true})),checkpoint:0,revision:0,resetId:0,mode:'practice',paused:false,complete:false,stage:'playing',condition:view==='wreck'?'breaking':'afloat',wreckAge:view==='wreck'?.35:0,crashId:view==='wreck'?1:0,obstacleId:null,strokes:[0,0,0,0],droppedSteps:0});
if(view==='crew'||view==='underside') scene.followCamera=()=>{scene.camera.position.set(4.2,view==='underside'?.65:3.0,4.5);scene.camera.lookAt(0,.65,0);};
if(view==='shore') scene.followCamera=()=>{scene.camera.position.set(9,3,-5);scene.camera.lookAt(15,.6,2);};
if(view==='trees') scene.followCamera=()=>{scene.camera.position.set(12,3,-4);scene.camera.lookAt(21,4.5,10);};
if(view==='waterwheel')scene.followCamera=()=>{scene.camera.position.set(riverX(-2,455),6,455);scene.camera.lookAt(riverX(5,465),2.2,465);};
if(view==='grass') scene.followCamera=()=>{scene.camera.position.set(13.2,.9,-2);scene.camera.lookAt(16,.45,2);};
if(view==='shoal')scene.followCamera=()=>{scene.camera.position.set(-4,6,245);scene.camera.lookAt(-10,.1,260);};
if(view==='bank')scene.followCamera=()=>{scene.camera.position.set(bankEdge(188,-1)+3.5,2.8,184);scene.camera.lookAt(bankEdge(193,-1),1.8,193);};
if(new URL(location.href).searchParams.has('low'))scene.setLowQuality(true);
document.getElementById('label').textContent=`RENDER FIXTURE · ${view.toUpperCase()} · authored pose for graphics QA`;
let previous=performance.now(), frames=0;
function frame(now){const dt=Math.min((now-previous)/1000,.05);previous=now;scene.render(dt,now/1000);document.body.dataset.frames=String(++frames);const q=sampleWaterwheel(scene.time);const q2=sampleWaterwheel2(scene.time);document.body.dataset.wheelError=String(Math.max(1-Math.abs(scene.wheel.quaternion.x*q.x+scene.wheel.quaternion.w*q.w),1-Math.abs(scene.wheel2.quaternion.x*q2.x+scene.wheel2.quaternion.w*q2.w)));document.body.dataset.sweeperError=String(Math.max(...scene.sweepers.map((log,i)=>log.position.distanceTo(sampleSweeper(scene.time,SWEEPERS[i])))));requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
